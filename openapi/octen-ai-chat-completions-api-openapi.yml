openapi: 3.2.0
info:
  title: Octen Ai Chat API
  version: 1.0.0
  description: 'Operations tagged Chat across 2 of this provider''s published API definitions: octen-ai-openapi.json, octen-ai-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.octen.ai
security:
- bearerAuth: []
- apiKeyAuth: []
tags:
- name: Chat Completions
paths:
  /v1/chat/completions:
    post:
      summary: Create a chat completion
      description: Compatible with the OpenAI Chat Completions protocol, with optional built-in `octen_broad_search` and `octen_search` tools.
      operationId: chat-completions
      x-mint:
        href: /api-reference/chat-completions
        metadata:
          title: LLM Chat (OpenAI-Compatible)
          sidebarTitle: LLM Chat (OpenAI-Compatible)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatCompletionRequest'
            examples:
              pureModel:
                summary: Plain model call
                value:
                  model: anthropic/claude-opus-4.8
                  messages:
                  - role: user
                    content: Explain attention in one sentence.
                  stream: false
                  max_tokens: 2048
                  temperature: 1
              withBroadSearch:
                summary: Built-in broad search tool
                value:
                  model: anthropic/claude-sonnet-4.6
                  messages:
                  - role: system
                    content: You are a helpful assistant.
                  - role: user
                    content: Compare cloud GPU pricing across major providers.
                  tools:
                  - type: octen_broad_search
                    parameters:
                      max_queries: 5
                      count: 10
                      highlight:
                        enable: true
                        max_tokens: 300
                      format: markdown
                  tool_choice: auto
                  stream: false
              withSearch:
                summary: Built-in search tool
                value:
                  model: anthropic/claude-sonnet-4.6
                  messages:
                  - role: system
                    content: You are a helpful assistant.
                  - role: user
                    content: What's the weather in Beijing today?
                  tools:
                  - type: octen_search
                    parameters:
                      max_searches: 3
                      count: 10
                      highlight:
                        enable: true
                        max_tokens: 300
                      format: markdown
                  tool_choice: auto
                  stream: false
              functionAndSearch:
                summary: Custom function + built-in search
                value:
                  model: openai/gpt-5.5
                  messages:
                  - role: user
                    content: Check tomorrow's weather in Shanghai, then create a travel reminder.
                  tools:
                  - type: octen_search
                  - type: function
                    function:
                      name: create_reminder
                      description: Create a reminder
                      parameters:
                        type: object
                        properties:
                          content:
                            type: string
                            description: Reminder content
                          time:
                            type: string
                            description: Reminder time, ISO 8601
                        required:
                        - content
                        - time
                  tool_choice: auto
              promptCaching:
                summary: Prompt caching
                value:
                  model: anthropic/claude-sonnet-4.6
                  messages:
                  - role: system
                    content:
                    - type: text
                      text: Product manual (long stable prefix)...
                      cache_control:
                        type: ephemeral
                        ttl: 5m
                  - role: user
                    content: What is the return policy?
                  max_tokens: 1024
      responses:
        '200':
          description: 'Successful chat completion. When `stream=false`, returns a single `chat.completion` object. When `stream=true`, returns a stream of `chat.completion.chunk` objects (`search_done`, `content`, `finish`, `usage`), followed by `data: [DONE]`.'
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ChatCompletionResponse'
                - $ref: '#/components/schemas/ChatCompletionChunk'
                discriminator:
                  propertyName: object
                  mapping:
                    chat.completion: '#/components/schemas/ChatCompletionResponse'
                    chat.completion.chunk: '#/components/schemas/ChatCompletionChunk'
              examples:
                nonStreaming:
                  summary: Non-streaming, plain model call
                  value:
                    id: gen-1749812456-xyz7890
                    object: chat.completion
                    created: 1749812456
                    model: anthropic/claude-opus-4.8
                    choices:
                    - index: 0
                      finish_reason: stop
                      message:
                        role: assistant
                        content: Attention lets a model dynamically weight its inputs and focus on the most relevant information.
                        refusal: null
                        reasoning: null
                    usage:
                      prompt_tokens: 18
                      completion_tokens: 32
                      total_tokens: 50
                promptCache:
                  summary: Non-streaming, prompt cache hit
                  value:
                    id: gen-1749812999-cache01
                    object: chat.completion
                    created: 1749812999
                    model: anthropic/claude-sonnet-4.6
                    choices:
                    - index: 0
                      finish_reason: stop
                      message:
                        role: assistant
                        content: Per the manual, 7-day no-reason returns are supported.
                        refusal: null
                        reasoning: null
                    usage:
                      prompt_tokens: 2106
                      completion_tokens: 18
                      total_tokens: 2124
                      prompt_tokens_details:
                        cached_tokens: 2048
                withSearch:
                  summary: Non-streaming, with built-in search
                  value:
                    id: gen-1749812345-abcd1234
                    object: chat.completion
                    created: 1749812345
                    model: anthropic/claude-sonnet-4.6
                    choices:
                    - index: 0
                      finish_reason: stop
                      message:
                        role: assistant
                        content: OpenRouter is a unified platform aggregating multiple LLM providers behind one API.
                        refusal: null
                        reasoning: null
                        annotations:
                        - type: url_citation
                          url_citation:
                            url: https://openrouter.ai/docs
                            title: OpenRouter Documentation
                            start_index: 0
                            end_index: 31
                    search_results:
                    - query: What is OpenRouter AI
                      results:
                      - title: OpenRouter Documentation
                        url: https://openrouter.ai/docs
                        highlights: OpenRouter provides a unified API for multiple LLM providers
                        authors: OpenRouter
                        time_published: '2024-11-02T00:00:00Z'
                        time_last_crawled: '2025-01-10T12:30:00Z'
                    usage:
                      num_search_queries: 1
                      prompt_tokens: 1058
                      completion_tokens: 132
                      total_tokens: 1190
                toolCall:
                  summary: Non-streaming, custom function call
                  value:
                    id: gen-1749812800-tool0001
                    object: chat.completion
                    created: 1749812800
                    model: openai/gpt-5.5
                    choices:
                    - index: 0
                      finish_reason: tool_calls
                      message:
                        role: assistant
                        content: null
                        tool_calls:
                        - id: call_abc123
                          type: function
                          function:
                            name: create_reminder
                            arguments: '{"content": "Rain in Shanghai tomorrow, bring an umbrella", "time": "2026-06-11T08:00:00+08:00"}'
                        refusal: null
                        reasoning: null
                    usage:
                      prompt_tokens: 230
                      completion_tokens: 45
                      total_tokens: 275
                streamSearchDone:
                  summary: Streaming, search_done chunk
                  value:
                    type: search_done
                    id: 20260318143837845RJQ9P28ZEC
                    object: chat.completion.chunk
                    created: 1773844717
                    model: anthropic/claude-opus-4.6
                    search_results:
                    - query: weather Beijing today
                      results:
                      - title: Beijing Weather
                        url: https://weather.com/beijing
                        highlights: Partly cloudy, high of 32C
                        authors: weather.com
                        time_published: '2026-06-10T00:00:00Z'
                        time_last_crawled: '2026-06-10T06:00:00Z'
                streamContent:
                  summary: Streaming, content chunk
                  value:
                    type: content
                    id: gen-1749812600-stream001
                    object: chat.completion.chunk
                    created: 1749812600
                    model: openai/gpt-5.4
                    choices:
                    - index: 0
                      delta:
                        role: assistant
                        content: 'OpenRouter is '
                      finish_reason: null
                streamFinish:
                  summary: Streaming, finish chunk
                  value:
                    type: finish
                    id: gen-1749812600-stream001
                    object: chat.completion.chunk
                    created: 1749812600
                    model: openai/gpt-5.4
                    choices:
                    - index: 0
                      delta: {}
                      finish_reason: stop
                streamUsage:
                  summary: Streaming, usage chunk
                  value:
                    type: usage
                    id: 20260318143837845RJQ9P28ZEC
                    object: chat.completion.chunk
                    created: 1773844727
                    model: anthropic/claude-opus-4.6
                    usage:
                      num_search_queries: 2
                      full_content_extra_count: 5
                      prompt_tokens: 1841
                      completion_tokens: 638
                      total_tokens: 2479
                      completion_tokens_details:
                        reasoning_tokens: 30
                refusal:
                  summary: Safety refusal
                  value:
                    id: gen-1749812700-refusal
                    object: chat.completion
                    created: 1749812700
                    model: openai/gpt-5.4
                    choices:
                    - index: 0
                      finish_reason: stop
                      message:
                        role: assistant
                        content: null
                        refusal: I can't help with that request.
                        reasoning: null
        '400':
          description: Missing or invalid parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIErrorResponse'
              example:
                error:
                  message: Missing or invalid parameter
                  type: invalid_request_error
                  param: null
                  code: null
        '401':
          description: Invalid API Key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIErrorResponse'
              example:
                error:
                  message: Invalid API Key
                  type: authentication_error
                  param: null
                  code: null
        '403':
          description: Insufficient balance in account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIErrorResponse'
              example:
                error:
                  message: Insufficient balance in account
                  type: permission_error
                  param: null
                  code: null
        '404':
          description: Model or resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIErrorResponse'
              example:
                error:
                  message: Model or resource not found
                  type: not_found_error
                  param: null
                  code: null
        '429':
          description: Exceeding the rate limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIErrorResponse'
              example:
                error:
                  message: Exceeding the rate limit
                  type: rate_limit_error
                  param: null
                  code: null
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIErrorResponse'
              example:
                error:
                  message: Internal error
                  type: api_error
                  param: null
                  code: null
      tags:
      - Chat Completions
    servers:
    - url: https://api.octen.ai
components:
  schemas:
    SystemMessage:
      type: object
      required:
      - role
      - content
      properties:
        role:
          type: string
          enum:
          - system
          description: The role of the message author. Always `system`.
        content:
          description: The system prompt content. A plain string or an array of content blocks.
          oneOf:
          - type: string
          - type: array
            items:
              $ref: '#/components/schemas/ChatContentBlock'
    ChatResponseFormat:
      type: object
      description: Controls the output format. Some models may not support structured output and will automatically fall back to `text`.
      properties:
        type:
          type: string
          enum:
          - text
          - json_object
          - json_schema
          default: text
          description: The output format type.
        json_schema:
          $ref: '#/components/schemas/ChatJsonSchemaSpec'
    ChatToolDefinition:
      oneOf:
      - $ref: '#/components/schemas/ChatFunctionTool'
      - $ref: '#/components/schemas/ChatOctenBroadSearchTool'
      - $ref: '#/components/schemas/ChatOctenSearchTool'
      discriminator:
        propertyName: type
        mapping:
          function: '#/components/schemas/ChatFunctionTool'
          octen_broad_search: '#/components/schemas/ChatOctenBroadSearchTool'
          octen_search: '#/components/schemas/ChatOctenSearchTool'
      description: A tool definition. One of a custom `function` tool, the built-in `octen_broad_search` tool, or the `octen_search` tool.
    ChatMessage:
      oneOf:
      - $ref: '#/components/schemas/SystemMessage'
      - $ref: '#/components/schemas/DeveloperMessage'
      - $ref: '#/components/schemas/UserMessage'
      - $ref: '#/components/schemas/AssistantMessage'
      - $ref: '#/components/schemas/ToolMessage'
      discriminator:
        propertyName: role
        mapping:
          system: '#/components/schemas/SystemMessage'
          developer: '#/components/schemas/DeveloperMessage'
          user: '#/components/schemas/UserMessage'
          assistant: '#/components/schemas/AssistantMessage'
          tool: '#/components/schemas/ToolMessage'
    ChatCompletionChoice:
      type: object
      description: A single completion choice in a non-streaming response.
      properties:
        index:
          type: integer
          description: The index of this choice. Usually 0.
        finish_reason:
          type: string
          enum:
          - stop
          - length
          - tool_calls
          - content_filter
          - error
          description: The reason the model stopped generating. `stop` indicates normal completion.
        message:
          $ref: '#/components/schemas/ChatCompletionMessage'
        logprobs:
          $ref: '#/components/schemas/ChatLogprobs'
    ChatSearchResultItem:
      type: object
      description: A single search result.
      properties:
        title:
          type: string
          description: The title of the result page.
        url:
          type: string
          description: The URL of the result page.
        highlights:
          type: string
          description: Query-relevant highlight snippets. Returned only if `highlight.enable` is true.
        full_content:
          type: string
          description: Full raw page content. Returned only if `full_content.enable` is true.
        authors:
          type: string
          description: Website name or author.
        time_published:
          type: string
          format: date-time
          description: Publish time in ISO 8601.
        time_last_crawled:
          type: string
          format: date-time
          description: Last crawl time in ISO 8601.
    ChatFunctionDefinition:
      type: object
      required:
      - name
      description: A custom function definition.
      properties:
        name:
          type: string
          description: The name of the function.
        description:
          type: string
          description: A description of what the function does.
        parameters:
          type: object
          description: The function's parameter definition in JSON Schema format.
        strict:
          type: boolean
          default: false
          description: Whether to enable strict mode. When enabled, generated arguments strictly conform to `parameters`.
    ChatReasoningOptions:
      type: object
      description: Options for reasoning models. Turns thinking on or off and sets the effort and budget.
      properties:
        enabled:
          type: boolean
          description: Set to `false` to turn off thinking. Overrides `effort` and `max_tokens`.
        effort:
          type: string
          enum:
          - max
          - xhigh
          - high
          - medium
          - low
          - minimal
          - none
          description: The reasoning effort level.
        max_tokens:
          type: integer
          minimum: 1024
          description: Thinking token budget.
    OctenBroadSearchToolParameters:
      description: Behavior configuration for the built-in `octen_broad_search` tool. Identical to `octen_search` except it accepts `max_queries` instead of `max_searches`. All parameters are optional and share the same semantics and defaults as the Web Search API.
      allOf:
      - type: object
        properties:
          max_queries:
            type: integer
            minimum: 1
            maximum: 30
            default: 5
            description: Upper bound on the number of sub-queries generated.
      - $ref: '#/components/schemas/WebSearchOptions'
    FullContentOptions:
      type: object
      description: Controls whether to return the full raw content of each result page.
      properties:
        enable:
          type: boolean
          default: false
          description: If true, returns full_content for each result.
        max_tokens:
          type: integer
          default: 2048
          minimum: 100
          maximum: 100000
          description: Maximum tokens of full content included per result.
    ChatCompletionChunkChoice:
      type: object
      description: A single choice in a streaming chunk.
      properties:
        index:
          type: integer
          description: The index of this choice. Usually 0.
        delta:
          $ref: '#/components/schemas/ChatCompletionDelta'
        finish_reason:
          type: string
          nullable: true
          enum:
          - stop
          - length
          - tool_calls
          - content_filter
          - error
          - null
          description: The reason generation stopped. `null` for intermediate chunks; set in the `finish` chunk.
        logprobs:
          $ref: '#/components/schemas/ChatLogprobs'
    UserMessage:
      type: object
      required:
      - role
      - content
      properties:
        role:
          type: string
          enum:
          - user
          description: The role of the message author. Always `user`.
        content:
          description: The content of the message. A plain string or an array of content blocks.
          oneOf:
          - type: string
          - type: array
            items:
              $ref: '#/components/schemas/ChatContentBlock'
    ChatToolCall:
      type: object
      required:
      - id
      - type
      - function
      description: A custom function call generated by the model.
      properties:
        index:
          type: integer
          description: The index of this tool call in the array.
        id:
          type: string
          description: A unique identifier for this tool call. Referenced by the corresponding `tool` message's `tool_call_id`.
        type:
          type: string
          enum:
          - function
          description: The type of tool call. Always `function`.
        function:
          $ref: '#/components/schemas/ChatToolCallFunction'
    ChatCompletionResponse:
      type: object
      required:
      - id
      - object
      - created
      - model
      - choices
      description: A non-streaming chat completion response. Returned when `stream=false`.
      properties:
        id:
          type: string
          description: The unique identifier for this request.
        object:
          type: string
          enum:
          - chat.completion
          description: The object type, always `chat.completion` for non-streaming responses.
        created:
          type: integer
          description: Unix timestamp (in seconds) of when the completion was created.
        model:
          type: string
          description: The model used for this completion.
        choices:
          type: array
          items:
            $ref: '#/components/schemas/ChatCompletionChoice'
          description: A list of completion choices.
        search_results:
          type: array
          items:
            $ref: '#/components/schemas/ChatSearchResultGroup'
          description: Search results. Present only when `octen_search` was actually triggered.
        usage:
          $ref: '#/components/schemas/ChatCompletionUsage'
        warning:
          type: string
          description: Warning message, if any.
    ChatToolChoiceObject:
      type: object
      required:
      - type
      description: Forces a specific tool. The named tool must be declared in `tools`.
      properties:
        type:
          type: string
          enum:
          - function
          - octen_broad_search
          - octen_search
          description: The type of tool to force.
        function:
          type: object
          description: The function to call. Required when `type` is `function`.
          required:
          - name
          properties:
            name:
              type: string
              description: The name of the function to call.
    ChatReasoningDetail:
      type: object
      description: Detailed reasoning information. Returned only for reasoning models.
      properties:
        format:
          type: string
          enum:
          - unknown
          - openai-responses-v1
          - azure-openai-responses-v1
          - xai-responses-v1
          - anthropic-claude-v1
          - google-gemini-v1
          description: The format of the reasoning information.
        index:
          type: integer
          description: The position of this entry in the output. Usually 0.
        type:
          type: string
          enum:
          - reasoning.text
          - reasoning.summary
          - reasoning.encrypted
          description: The kind of reasoning information.
        text:
          type: string
          description: Reasoning text. Present only when `type` is `reasoning.text`.
        summary:
          type: string
          description: Reasoning summary. Present only when `type` is `reasoning.summary`.
        data:
          type: string
          description: Encrypted reasoning. Present only when `type` is `reasoning.encrypted`.
    ChatToolCallFunction:
      type: object
      required:
      - name
      - arguments
      description: The function invocation details within a tool call.
      properties:
        name:
          type: string
          description: The name of the function to call.
        arguments:
          type: string
          description: The arguments to the function, as a JSON string generated by the model.
    ChatCompletionRequest:
      type: object
      required:
      - model
      - messages
      description: Request body for the Chat Completions API. Some parameters apply only to certain models; unsupported parameters are ignored for the selected model.
      properties:
        model:
          type: string
          enum:
          - openai/gpt-6-astra
          - openai/gpt-5.6-sol
          - openai/gpt-5.6-terra
          - openai/gpt-5.6-luna
          - openai/gpt-5.5-pro
          - openai/gpt-5.5
          - openai/gpt-5.4
          - anthropic/claude-fable-5.1
          - anthropic/claude-fable-5
          - anthropic/claude-opus-5
          - anthropic/claude-opus-4.8
          - anthropic/claude-opus-4.6
          - anthropic/claude-sonnet-5
          - anthropic/claude-sonnet-4.6
          - anthropic/claude-haiku-4.5
          - google/gemini-3.8-flash
          - google/gemini-3.5-flash
          - google/gemini-3.5-flash-lite
          - google/gemini-3.1-pro-preview
          - google/gemini-3.1-flash-lite
          - google/gemini-3-flash-preview
          - moonshotai/kimi-k3
          - moonshotai/kimi-k2.6
          - moonshotai/kimi-k2.5
          - minimax/minimax-m2.5
          - qwen/qwen3.6-plus
          - deepseek/deepseek-v4-pro
          - deepseek/deepseek-v4-flash-0731
          description: The model to use for chat completion.
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ChatMessage'
          description: The conversation so far. System prompt plus user and assistant messages in chronological order.
        tools:
          type: array
          items:
            $ref: '#/components/schemas/ChatToolDefinition'
        tool_choice:
          description: 'Controls tool invocation. `none`: never call tools; `auto`: model decides (default); `required`: must call a tool. Can also be an object to force a specific tool. Only valid when `tools` is set.'
          oneOf:
          - type: string
            enum:
            - none
            - auto
            - required
          - $ref: '#/components/schemas/ChatToolChoiceObject'
        parallel_tool_calls:
          type: boolean
          default: true
          description: Whether the model may issue multiple tool calls in one reply. When `false`, at most one tool call per turn.
        stream:
          type: boolean
          default: false
          description: Whether to enable streaming output. When `true`, returns `chat.completion.chunk` objects incrementally.
        max_tokens:
          type: integer
          minimum: 1
          description: Maximum number of tokens the model can output. If not set, the model's internal default limit is used.
        max_completion_tokens:
          type: integer
          minimum: 1
          description: Maximum completion tokens, including reasoning and visible output tokens. If not set, the model's internal default limit is used.
        temperature:
          type: number
          minimum: 0
          maximum: 2
          default: 1.0
          description: Controls randomness in generation. Higher values produce more diverse output; lower values produce more deterministic output.
        top_p:
          type: number
          exclusiveMinimum: 0
          maximum: 1
          default: 1.0
          description: Nucleus sampling. Only tokens with cumulative probability up to `top_p` are considered.
        top_k:
          type: integer
          minimum: 0
          default: 0
          description: Sample only from the top K most probable tokens. `0` disables it.
        min_p:
          type: number
          minimum: 0
          maximum: 1
          default: 0
          description: Minimum probability threshold relative to the most probable token. Tokens below it are filtered out. `0` disables it.
        top_a:
          type: number
          minimum: 0
          maximum: 1
          default: 0
          description: Dynamic filtering threshold based on the most probable token. `0` disables it.
        repetition_penalty:
          type: number
          exclusiveMinimum: 0
          maximum: 2
          default: 1.0
          description: Penalizes tokens already present in the input. Above 1 suppresses repetition; below 1 encourages it.
        frequency_penalty:
          type: number
          minimum: -2
          maximum: 2
          default: 0
          description: Penalizes tokens by their frequency in the output so far. Positive values reduce repetition.
        presence_penalty:
          type: number
          minimum: -2
          maximum: 2
          default: 0
          description: Penalizes tokens that have already appeared. Positive values encourage new topics.
        response_format:
          $ref: '#/components/schemas/ChatResponseFormat'
        stop:
          type: array
          items:
            type: string
          description: Stop sequences. Generation stops when any of these strings is encountered.
        seed:
          type: integer
          description: Seed for reproducibility. With the same parameters and model version, output should be as consistent as possible.
        reasoning:
          $ref: '#/components/schemas/ChatReasoningOptions'
        reasoning_effort:
          type: string
          enum:
          - none
          - minimal
          - low
          - medium
          - high
          - xhigh
          - max
          description: Top-level alias for `reasoning.effort`. If both are set, `reasoning` takes precedence.
        verbosity:
          type: string
          enum:
          - low
          - medium
          - high
          default: medium
          description: Controls how verbose the reply is.
        logit_bias:
          type: object
          additionalProperties:
            type: number
            minimum: -100
            maximum: 100
